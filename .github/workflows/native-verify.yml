name: Native & Bundle Verification

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'example/**'
      - 'forms/**'
      - 'package*.json'
      - '.github/workflows/native-verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'example/**'
      - 'forms/**'
      - 'package*.json'
      - '.github/workflows/native-verify.yml'
  workflow_dispatch:
    inputs:
      run_maestro_ios:
        description: 'Build iOS Simulator app and run Maestro SwiftUI E2E flows'
        required: false
        default: false
        type: boolean
      run_maestro_android:
        description: 'Build Android APK and run Maestro Jetpack Compose E2E flows on Android Emulator'
        required: false
        default: false
        type: boolean

concurrency:
  group: native-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metro-and-prebuild:
    name: Metro Bundle & Native iOS/Android Prebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root & example dependencies
        run: |
          npm ci
          cd example && npm ci

      - name: Build library package
        run: npm run build

      - name: Verify npm pack consumer tarball integrity
        run: |
          TARBALL=$(npm pack --quiet | tail -n 1)
          tar -tf "$TARBALL" | grep -q "^package/dist/index.js$"
          tar -tf "$TARBALL" | grep -q "^package/dist/index.d.ts$"
          tar -tf "$TARBALL" | grep -q "^package/dist/core/nativePlatformBridge.ios.js$"
          tar -tf "$TARBALL" | grep -q "^package/dist/core/nativePlatformBridge.android.js$"
          tar -tf "$TARBALL" | grep -q "^package/schema/expo-form.schema.json$"
          rm -f "$TARBALL"

      - name: Verify Metro production bundle export (example)
        working-directory: example
        run: npx expo export --platform web

      - name: Verify native Android & iOS project generation (expo prebuild)
        working-directory: example
        env:
          CI: '1'
        run: npx expo prebuild --no-install --platform all

  maestro-ios-simulator:
    name: Maestro Native SwiftUI E2E (iOS Simulator)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_maestro_ios == true }}
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & build library
        run: |
          npm ci
          npm run build
          cd example && npm ci

      - name: Build & install on iOS Simulator
        working-directory: example
        run: npx expo run:ios --configuration Release --no-bundler

      - name: Install Maestro CLI & run native flows
        working-directory: example
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro test .maestro/smoke-forms.yaml

  maestro-android-emulator:
    name: Maestro Native Jetpack Compose E2E (Android Emulator)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_maestro_android == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & Gradle cache
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build library
        run: |
          npm ci
          npm run build
          cd example && npm ci

      - name: Prebuild Android project & assemble Release APK
        working-directory: example
        env:
          CI: '1'
        run: |
          npx expo prebuild --platform android
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot Android Emulator & run Maestro Jetpack Compose flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install example/android/app/build/outputs/apk/release/app-release.apk
            maestro test example/.maestro/smoke-forms.yaml
